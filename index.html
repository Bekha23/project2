<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Змейка</h1>
        <div class="score-container">
            <div class="score">Счет: <span id="score">0</span></div>
            <div class="high-score">Рекорд: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="control-instructions">
                <p>Используйте стрелки для управления</p>
                <p>Пробел - пауза/возобновить</p>
                <p>Enter - новая игра</p>
            </div>
            <button id="startBtn">Начать игру</button>
            <button id="pauseBtn">Пауза</button>
            <button id="restartBtn">Новая игра</button>
        </div>
        <div id="gameOver" class="game-over hidden">
            <h2>Игра окончена!</h2>
            <p>Ваш счет: <span id="finalScore">0</span></p>
            <button id="playAgainBtn">Играть снова</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
